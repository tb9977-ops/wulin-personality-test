<body>
<header class="hero">
  <div class="seal">江 湖 人 格 图 鉴</div>
  <h1>测测你是《武林群侠传》里的谁？</h1>
  <p>如果你身在江湖，你会成为怎样的人？用 15 道情境题，找到与你最相似的武林人物。</p>
  <div class="meta"><span>◈ 15 道情境题</span><span>◈ 约 3 分钟</span><span>◈ 12 种人物类型</span></div>
</header>
<main class="wrap">
  <section class="intro">
    <strong>答题提示：</strong>选最接近你真实反应的答案，不必选“看起来最正确”的那个。测试会结合你的选择给出主角色、第二性格，以及每道题对应的性格解释。
  </section>
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-head"><span id="progressText">已完成 0 / 15 题</span><span id="progressPct">0%</span></div>
    <div class="progress"><span id="progressBar"></span></div>
  </div>
  <form id="quiz" novalidate>
    <div id="questions"></div>
    <div class="actions">
      <button class="btn btn-primary" id="submitBtn" type="submit">揭晓我的江湖人物</button>
      <button class="btn btn-secondary" id="resetBtn" type="button">重新作答</button>
    </div>
    <div class="error" id="errorMsg">还有题目没有回答，请完成全部 15 题后揭晓结果。</div>
    <p class="hint">本测试用于娱乐与自我观察，不是专业心理测评。</p>
  </form>
  <section class="result" id="result" aria-live="polite"></section>
  <div class="footer">江湖很大，人物不止一种。你的结果代表答题时呈现出的倾向，不是给你贴上永久标签。</div>
</main>
<script>
const characters = {

"古实":{tag:"踏实守序型",summary:"你相信可靠的积累胜过一时的风光。你的力量未必最张扬，却经得起时间检验。",strength:"耐心、自律、稳定，适合长期积累。",weak:"可能过于谨慎，低估自己的能力或错过机会。",reason:"你更相信持续努力和可靠的方法，而不是投机取巧。你愿意把基础做好，等待长期回报。"},

};

["A","坦诚指出问题，也会顾及对方感受，希望他真正走出来。","沈湘芸"],
["B","先理解他为什么改不了，再找合适的方式提醒。","沈湘芸"],
["C","尊重他的选择，但把自己的界限说清楚。","史燕"],
["D","不急着评判，帮他从不同角度看清问题。","无瑕子"]]},
];
// Balance validation: every character is assigned exactly five answer slots.
const counts={}; questions.forEach(q=>q.opts.forEach(o=>counts[o[2]]=(counts[o[2]]||0)+1));
const balanced=Object.keys(characters).every(c=>counts[c]===5);
const letters=["A","B","C","D"];
const questionsEl=document.getElementById("questions");
questions.forEach((q,i)=>{
  const section=document.createElement("section");section.className="question";section.id="question-"+i;
  const head=document.createElement("div");head.className="qhead";
  const num=document.createElement("div");num.className="qnum";num.textContent=String(i+1).padStart(2,"0");
  const title=document.createElement("h2");title.textContent=q.q;head.append(num,title);section.append(head);
  const opts=document.createElement("div");opts.className="options";
  q.opts.forEach((o,j)=>{
    const label=document.createElement("label");label.className="option";
    label.innerHTML=`<input type="radio" name="q${i}" value="${j}"><span class="letter">${letters[j]}</span><span class="option-text"></span>`;
    label.querySelector(".option-text").textContent=o[1];
    label.addEventListener("click",()=>{setTimeout(()=>{opts.querySelectorAll(".option").forEach(x=>x.classList.remove("selected"));label.classList.add("selected");updateProgress()},0)});
    opts.append(label);
  });
  section.append(opts);questionsEl.append(section);
});
function getAnswers(){return questions.map((q,i)=>{const el=document.querySelector(`input[name="q${i}"]:checked`);return el?Number(el.value):null})}
function updateProgress(){const a=getAnswers(),n=a.filter(x=>x!==null).length;document.getElementById("progressText").textContent=`已完成 ${n} / ${questions.length} 题`;document.getElementById("progressPct").textContent=Math.round(n/questions.length*100)+"%";document.getElementById("progressBar").style.width=(n/questions.length*100)+"%";document.getElementById("errorMsg").style.display="none"}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function makeResult(){
 const answers=getAnswers();if(answers.some(x=>x===null)){document.getElementById("errorMsg").style.display="block";const idx=answers.findIndex(x=>x===null);document.getElementById("question-"+idx).scrollIntoView({behavior:"smooth",block:"center"});return}
 const scores={};Object.keys(characters).forEach(c=>scores[c]=0);
 answers.forEach((a,i)=>scores[questions[i].opts[a][2]]++);
 const ranked=Object.entries(scores).sort((a,b)=>b[1]-a[1]);
 const top=ranked[0][1],winners=ranked.filter(x=>x[1]===top).map(x=>x[0]);
 // Fair tie-break: show all tied top characters rather than arbitrarily picking one.
 const primary=winners[0],profile=characters[primary];
 const second=ranked.find(x=>!winners.includes(x[0]));
 const result=document.getElementById("result");
 const winnerTitle=winners.length===1?primary:winners.join(" · ");
 const winnerTag=winners.length===1?profile.tag:"复合型江湖人格";
 const winnerSummary=winners.length===1?profile.summary:"你的答案同时指向几种鲜明的性格倾向。你不是单一模板，更适合结合下面的并列角色一起理解。";
 const winnerReason=winners.length===1?profile.reason:"出现并列最高分，说明你的选择呈现多种同样突出的倾向。为了公平，测试不会用随机数或隐藏规则强行决定唯一角色。";
 const characterPortraits = {
  "东方未明": {src:"https://www.newton.com.tw/img/f/92d/nBnauUDNlhzNkNGM4MTN2ADOjNWOzkjMhJjN1ETMyImMmJmZzQzM1gzMxEzLtVGdp9yYpB3LltWahJ2Lt92YuUHZpFmYuMmczdWbp9yL6MHc0RHa.jpg", alt:"东方未明正派风格角色立绘"},
  "谷月轩": {src:"https://so1.360tres.com/t0154589b8f308add2a.jpg", alt:"谷月轩角色立绘"},
  "古实": {src:"https://img.3dmgame.com/uploads/allimg/160701/313_160701142100_1_lit.jpg", alt:"古实单人角色立绘（《侠客风云传前传》）"}
 };
 const portraitFor = name => characterPortraits[name] ? `<img class="result-character-image" src="${characterPortraits[name].src}" alt="${characterPortraits[name].alt}" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'">` : "";
 const winnerPortraits = winners.map(portraitFor).join("");
 let html=`<div class="result-hero">${winnerPortraits}<div class="result-kicker">你的江湖人物鉴定结果</div><h2>${escapeHtml(winnerTitle)}</h2><div class="tag">${escapeHtml(winnerTag)}</div><p>${escapeHtml(winnerSummary)}</p></div>`;
 html+=`<div class="result-body"><h3>为什么你会得到这个结果？</h3><p>${escapeHtml(winnerReason)}</p><div class="traits"><div class="trait"><small>你的优势</small>${escapeHtml(winners.length===1?profile.strength:winners.map(c=>characters[c].strength).join(" "))}</div><div class="trait"><small>需要留意的盲点</small>${escapeHtml(winners.length===1?profile.weak:winners.map(c=>characters[c].weak).join(" "))}</div></div>`;
 if(second){const secondPortrait=characterPortraits[second[0]]?`<img class="secondary-portrait" src="${characterPortraits[second[0]].src}" alt="${characterPortraits[second[0]].alt}" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'">`:"";html+=`<h3 style="margin-top:22px">你的第二性格</h3><div class="secondary">${secondPortrait}<div class="rank">次高分</div><div class="secondary-copy"><strong>${escapeHtml(second[0])} · ${escapeHtml(characters[second[0]].tag)}</strong><span>${escapeHtml(characters[second[0]].summary)}</span></div></div>`}
 if(winners.length>1){html+=`<h3 style="margin-top:22px">并列角色解析</h3>`+winners.map(c=>`<div class="secondary"><div class="rank">并列</div><div><strong>${escapeHtml(c)} · ${escapeHtml(characters[c].tag)}</strong><span>${escapeHtml(characters[c].reason)}</span></div></div>`).join("")}
 html+=`</div><div class="result-body"><h3>逐题解析：你的选择透露了什么？</h3><div class="answer-review">`;
 answers.forEach((a,i)=>{const opt=questions[i].opts[a],c=opt[2];html+=`<div class="review-item"><strong>${i+1}. ${escapeHtml(questions[i].q)}</strong><p>你的选择：${letters[a]}. ${escapeHtml(opt[1])}</p><p><b>${escapeHtml(c)}（${escapeHtml(characters[c].tag)}）</b>：${escapeHtml(characters[c].reason)}</p></div>`});
 html+=`</div></div><div class="result-body"><h3>分享你的江湖身份</h3><div class="share-card" id="shareCard"><div class="small">WULIN PERSONALITY PROFILE</div><h3>${escapeHtml(winnerTitle)}</h3><div class="share-tag">${escapeHtml(winnerTag)}</div><p>${escapeHtml(winnerSummary)}</p><p style="margin-top:16px">测测你在《武林群侠传》里是谁？</p></div><div class="actions"><button class="btn btn-primary" type="button" id="copyBtn">复制结果文案</button><button class="btn btn-secondary" type="button" id="saveBtn">打印 / 保存为 PDF</button></div><div class="toast" id="copyToast">结果文案已复制。</div><p class="note">提示：点击“打印 / 保存为 PDF”，在系统打印窗口中选择“另存为 PDF”。若要制作图片海报，可对结果卡片截图。</p></div>`;
 result.innerHTML=html;result.classList.add("show");document.getElementById("quiz").style.display="none";document.getElementById("progressWrap").style.display="none";result.scrollIntoView({behavior:"smooth",block:"start"});
 document.getElementById("copyBtn").addEventListener("click",async()=>{const text=`我在《武林群侠传》性格测试中的结果：${winnerTitle}（${winnerTag}）\n${winnerSummary}\n优势：${winners.map(c=>characters[c].strength).join("；")}\n需要留意：${winners.map(c=>characters[c].weak).join("；")}\n你也来测测自己在江湖里是谁！`;try{await navigator.clipboard.writeText(text)}catch(e){const ta=document.createElement("textarea");ta.value=text;document.body.append(ta);ta.select();document.execCommand("copy");ta.remove()}document.getElementById("copyToast").style.display="block"});
 document.getElementById("saveBtn").addEventListener("click",()=>window.print());
}
document.getElementById("quiz").addEventListener("submit",e=>{e.preventDefault();makeResult()});
document.getElementById("resetBtn").addEventListener("click",()=>{document.getElementById("quiz").reset();document.querySelectorAll(".option").forEach(x=>x.classList.remove("selected"));document.getElementById("result").classList.remove("show");document.getElementById("result").innerHTML="";document.getElementById("quiz").style.display="block";document.getElementById("progressWrap").style.display="block";document.getElementById("errorMsg").style.display="none";updateProgress();window.scrollTo({top:0,behavior:"smooth"})});
updateProgress();
if(!balanced){console.warn("角色选项分配不平衡",counts)}
</script>
</body>
</html>
